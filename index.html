<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101925">
<title>Flappy Dunk — Court Run</title>
<style>
:root{color-scheme:dark;--ink:#f7f4e9;--muted:#aab7c4;--lime:#d9ff67;--orange:#ff7a37}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{display:grid;place-items:center;background:radial-gradient(ellipse at 50% 35%,#263547 0,#131e2a 52%,#0c141d 100%);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:manipulation;user-select:none;-webkit-tap-highlight-color:transparent}
.game{position:relative;width:min(100vw,60vh);height:min(100dvh,166.6667vw);aspect-ratio:3/5;overflow:hidden;background:#f4e8d3;border:1px solid rgba(255,255,255,.14);border-radius:22px;box-shadow:0 28px 90px #03080dbb,0 0 0 8px #ffffff08}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;inset:0;pointer-events:none;color:var(--ink)}
.brand{position:absolute;top:max(18px,env(safe-area-inset-top));left:20px;display:flex;align-items:center;gap:9px;font-size:11px;font-weight:850;letter-spacing:.19em;text-transform:uppercase;color:#f7f4e9cc}
.brand-mark{display:grid;place-items:center;width:27px;height:27px;border-radius:9px;background:var(--lime);color:#18222b;font-size:15px;box-shadow:0 3px 12px #10192530}
.score{position:absolute;top:19px;left:50%;transform:translateX(-50%);text-align:center;text-shadow:0 2px 8px #17202a55}
.score-label{display:block;font-size:9px;font-weight:850;letter-spacing:.24em;color:#fff9}
.score-value{display:block;font-size:44px;line-height:1.05;font-weight:950;letter-spacing:-.06em;font-variant-numeric:tabular-nums}
.best{position:absolute;top:24px;right:18px;padding:7px 10px;border:1px solid #ffffff40;border-radius:999px;background:#10192525;backdrop-filter:blur(8px);font-size:10px;font-weight:800;letter-spacing:.06em;color:#fff}
.best b{color:var(--lime);margin-left:4px}
.screen{position:absolute;inset:0;display:grid;place-items:center;padding:28px;text-align:center;background:linear-gradient(180deg,#10192510,#10192522);pointer-events:auto}
.screen[hidden]{display:none}
.card{width:min(100%,300px);padding:27px 23px 22px;border:1px solid #ffffffb0;border-radius:25px;background:#fff9f0e8;color:#18232d;box-shadow:0 18px 50px #17202a36;backdrop-filter:blur(12px)}
.eyebrow{margin:0 0 9px;color:#73808a;font-size:10px;font-weight:900;letter-spacing:.22em;text-transform:uppercase}
h1{margin:0;color:#17232d;font-size:clamp(35px,10vw,48px);line-height:.91;font-weight:1000;letter-spacing:-.08em}
h1 span{color:#ef6931}
.description{margin:15px auto 21px;max-width:220px;color:#53616b;font-size:13px;line-height:1.5}
.action{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:49px;border:0;border-radius:14px;background:#182631;color:#f9f6eb;font:850 13px inherit;letter-spacing:.02em;box-shadow:0 6px 0 #0d151c;cursor:pointer;pointer-events:auto;transition:transform .12s,box-shadow .12s}
.action:active{transform:translateY(4px);box-shadow:0 2px 0 #0d151c}
.action .arrow{color:var(--lime);font-size:17px}
.hint{margin:15px 0 0;color:#7a858b;font-size:10px;font-weight:700;letter-spacing:.04em}
.result{display:none;margin:17px 0 4px;padding:12px 0;border-top:1px solid #18263118;border-bottom:1px solid #18263118}
.result strong{display:block;font-size:37px;line-height:1;font-weight:950;letter-spacing:-.06em}
.result span{font-size:9px;font-weight:850;letter-spacing:.18em;text-transform:uppercase;color:#7a858b}
.game.over .result{display:block}
.game.over .card{padding-top:23px}
@media(max-height:560px){.game{border-radius:14px}.brand{top:12px}.score{top:9px}.score-value{font-size:36px}.best{top:14px}.card{padding:18px}.description{margin:10px auto 14px}}
</style>
</head>
<body>
<main class="game" id="game" aria-label="Flappy Dunk game">
  <canvas id="c" width="720" height="1200" aria-label="Basketball game court"></canvas>
  <div class="hud" aria-hidden="true">
    <div class="brand"><span class="brand-mark">↗</span> COURT RUN</div>
    <div class="score"><span class="score-label">SCORE</span><span class="score-value" id="score">0</span></div>
    <div class="best">BEST <b id="best">0</b></div>
    <section class="screen" id="screen">
      <div class="card">
        <p class="eyebrow" id="eyebrow">One more run?</p>
        <h1 id="headline">FLAPPY<br><span>DUNK</span></h1>
        <p class="description" id="description">Keep the ball in the air and thread every hoop. Clean swishes are the way to the top.</p>
        <div class="result"><strong id="final-score">0</strong><span>points scored</span></div>
        <button class="action" id="start"><span id="button-label">Start game</span><span class="arrow">↗</span></button>
        <p class="hint" id="hint">TAP OR PRESS SPACE TO FLAP</p>
      </div>
    </section>
  </div>
</main>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),game=document.getElementById('game');
const W=360,H=600,R=17,G=1080,JUMP=385,BX=106,HW=94,GAP=258;
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),screenEl=document.getElementById('screen');
let best=0;try{best=Number(localStorage.getItem('fds_best'))||0}catch(e){}bestEl.textContent=best;
let st='ready',score=0,ball,hoops,speed,pops=[],t=0,scroll=0,flap=0;
function resize(){const dpr=Math.min(window.devicePixelRatio||1,2),rect=game.getBoundingClientRect();cv.width=Math.round(rect.width*dpr);cv.height=Math.round(rect.height*dpr);ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0)}
new ResizeObserver(resize).observe(game);resize();
const mk=x=>({x,y:190+Math.random()*260,done:false,touched:false});
function reset(){ball={y:300,vy:0,rot:0};hoops=[mk(330)];score=0;speed=105;pops=[];st='ready';scoreEl.textContent='0';game.classList.remove('over');screenEl.hidden=false;document.getElementById('eyebrow').textContent='One more run?';document.getElementById('headline').innerHTML='FLAPPY<br><span>DUNK</span>';document.getElementById('description').textContent='Keep the ball in the air and thread every hoop. Clean swishes are the way to the top.';document.getElementById('button-label').textContent='Start game';document.getElementById('hint').textContent='TAP OR PRESS SPACE TO FLAP'}
function die(){st='over';game.classList.add('over');screenEl.hidden=false;document.getElementById('eyebrow').textContent='Run complete';document.getElementById('headline').innerHTML='NICE<br><span>RUN.</span>';document.getElementById('description').textContent=score>best?'A new personal best. The next one is yours.':'The court is waiting. Can you beat your best?';document.getElementById('button-label').textContent='Play again';document.getElementById('hint').textContent='TAP OR PRESS SPACE TO RESTART';document.getElementById('final-score').textContent=score;if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('fds_best',best)}catch(e){}}}
function tap(){if(st==='over'){reset();return}if(st==='ready'){st='play';screenEl.hidden=true}ball.vy=-JUMP;flap=1}
document.getElementById('start').addEventListener('click',e=>{e.stopPropagation();if(st==='over')reset();tap()});
game.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;e.preventDefault();tap()});
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();tap()}});
function update(dt){if(st==='ready'){ball.y=300+Math.sin(t*3.5)*7;return}if(st!=='play')return;const py=ball.y;speed=Math.min(168,105+score*2.1);scroll+=speed*dt;ball.vy+=G*dt;ball.y+=ball.vy*dt;ball.rot+=dt*3;if(ball.y<R){ball.y=R;ball.vy=0}if(ball.y>H-R-10){die();return}
for(const h of hoops){h.x-=speed*dt;for(const rx of [h.x,h.x+HW]){const dx=BX-rx,dy=ball.y-h.y,rr=R+5;if(Math.abs(dx)<rr&&Math.hypot(dx,dy)<rr){h.touched=true;const need=Math.sqrt(rr*rr-dx*dx),dir=dy>=0?1:-1;ball.y=h.y+dir*need;const ny=(ball.y-h.y)/rr,dot=ball.vy*ny;if(dot<0)ball.vy-=1.6*dot*ny}}
// A basket counts only when the ball travels downward through the opening.
if(!h.done&&py<h.y&&ball.y>=h.y&&BX-R>h.x+4&&BX+R<h.x+HW-4){h.done=true;score++;scoreEl.textContent=score;pops.push({txt:h.touched?'NICE!':'SWISH!',a:1,y:150})}
if(!h.done&&h.x+HW+5<BX-R){die();return}}
while(hoops[hoops.length-1].x<W+60)hoops.push(mk(hoops[hoops.length-1].x+GAP));hoops=hoops.filter(h=>h.x>-HW-30)}
function text(s,x,y,size,col='#fff',stroke){ctx.font='900 '+size+'px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='alphabetic';if(stroke){ctx.lineWidth=6;ctx.lineJoin='round';ctx.strokeStyle=stroke;ctx.strokeText(s,x,y)}ctx.fillStyle=col;ctx.fillText(s,x,y)}
function star(x,y,r,col){ctx.fillStyle=col;ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}ctx.closePath();ctx.fill()}
function drawCourt(){ctx.fillStyle='#f1e5cf';ctx.fillRect(0,0,W,H);ctx.fillStyle='#f7eddd';ctx.fillRect(12,0,W-24,H);const bw=60,bh=30,off=(scroll*.38)%bw;ctx.strokeStyle='#dec9aa';ctx.lineWidth=1;for(let r=0;r*bh<H;r++){const y=r*bh,sh=(r%2?bw/2:0)-off;ctx.beginPath();ctx.moveTo(12,y);ctx.lineTo(W-12,y);ctx.stroke();for(let x=sh-bw;x<W+bw;x+=bw){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+bh);ctx.stroke()}}ctx.strokeStyle='#e6cfae';ctx.lineWidth=2;ctx.beginPath();ctx.arc(W/2,H+4,104,Math.PI,Math.PI*2);ctx.stroke();ctx.fillStyle='#d5b890';ctx.fillRect(0,H-11,W,11);ctx.fillStyle='#bb9a73';ctx.fillRect(0,H-11,W,2)}
function ring(h,front){const cx=h.x+HW/2,y=h.y;ctx.lineCap='round';ctx.beginPath();ctx.ellipse(cx,y,HW/2,12,0,front?0:Math.PI,front?Math.PI:2*Math.PI);ctx.strokeStyle='#a72f23';ctx.lineWidth=9;ctx.stroke();ctx.strokeStyle='#ed5a3c';ctx.lineWidth=4;ctx.stroke()}
function drawBall(){ctx.save();ctx.translate(BX,ball.y);ctx.save();ctx.rotate(-.55+Math.sin(flap*14)*.48*flap);ctx.fillStyle='#fffdf6';ctx.strokeStyle='#837b70';ctx.lineWidth=1.4;ctx.beginPath();ctx.ellipse(-10,-8,14,6,-.3,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.beginPath();ctx.ellipse(-7,-1,10,4.5,-.1,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore();ctx.rotate(ball.rot);const g=ctx.createRadialGradient(-6,-7,2,0,0,R);g.addColorStop(0,'#ffbd55');g.addColorStop(1,'#e96320');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,R,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#713312';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,R,0,Math.PI*2);ctx.moveTo(-R,0);ctx.lineTo(R,0);ctx.moveTo(0,-R);ctx.lineTo(0,R);ctx.stroke();ctx.beginPath();ctx.arc(-R*1.25,0,R*.82,-1,1);ctx.arc(R*1.25,0,R*.82,Math.PI-1,Math.PI+1);ctx.stroke();ctx.restore()}
function draw(){drawCourt();for(const h of hoops)ring(h,false);drawBall();for(const h of hoops)ring(h,true);for(const p of pops){ctx.save();ctx.globalAlpha=Math.min(1,p.a*1.5);ctx.translate(W/2,p.y);ctx.rotate(-.1);star(-79,-8,14,'#e8a82c');star(79,-34,10,'#e8a82c');text(p.txt,0,0,40,'#e98b27','#fff9ed');ctx.restore();p.y-=.55;p.a-=.018}pops=pops.filter(p=>p.a>0)}
let last=performance.now();function loop(n){const dt=Math.min(.033,(n-last)/1000);last=n;t+=dt;flap=Math.max(0,flap-dt*2.5);update(dt);draw();requestAnimationFrame(loop)}
reset();requestAnimationFrame(loop);
</script>
</body>
</html>
